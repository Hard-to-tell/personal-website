name: Fetch shelf covers

on:
  push:
    branches:
      - main
    paths:
      - source/_data/shelf.yml
      - tools/fetch-shelf-covers.py
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: shelf-covers
  cancel-in-progress: false

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download covers
        run: python -m pip install --disable-pip-version-check Pillow PyYAML && python tools/fetch-shelf-covers.py

      # a push made with the workflow token does not start other workflows, so redeploy explicitly
      - name: Commit covers and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A source/images/shelf
          if git diff --cached --quiet; then
            echo "Covers already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "书影音：更新封面"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
