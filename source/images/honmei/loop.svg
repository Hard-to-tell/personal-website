<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">本命 HONMEI 的推荐流程</title>
  <desc id="d">收藏经过读懂口味、找候选、打分、排成一卷，变成推荐；你对推荐的反馈和调音评分再回到口味里。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a7f72"/>
    </marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;fill:#2f2a24}
      .h{font-size:17px;font-weight:700}
      .s{font-size:12.5px;fill:#6b6157}
      .box{fill:#fffaf2;stroke:#d9cbb8;stroke-width:1.5}
      .key{fill:#fff3d1;stroke:#e0b84a;stroke-width:1.5}
      .ln{stroke:#8a7f72;stroke-width:1.6;fill:none}
      .fb{stroke:#c96f4a;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="760" height="360" rx="14" fill="#f6f1ea"/>

  <rect class="box" x="20" y="40" width="124" height="86" rx="10"/>
  <text class="h" x="82" y="76" text-anchor="middle">你的收藏</text>
  <text class="s" x="82" y="100" text-anchor="middle">哔咔 + 禁漫</text>

  <rect class="key" x="172" y="40" width="140" height="86" rx="10"/>
  <text class="h" x="242" y="72" text-anchor="middle">读懂口味</text>
  <text class="s" x="242" y="95" text-anchor="middle">标签偏爱度</text>
  <text class="s" x="242" y="113" text-anchor="middle">口味簇 · 熟悉的笔</text>

  <rect class="box" x="340" y="40" width="124" height="86" rx="10"/>
  <text class="h" x="402" y="72" text-anchor="middle">找候选</text>
  <text class="s" x="402" y="95" text-anchor="middle">按作者、标签</text>
  <text class="s" x="402" y="113" text-anchor="middle">原作、相邻去搜</text>

  <rect class="box" x="492" y="40" width="112" height="86" rx="10"/>
  <text class="h" x="548" y="72" text-anchor="middle">打分</text>
  <text class="s" x="548" y="95" text-anchor="middle">几项相似度</text>
  <text class="s" x="548" y="113" text-anchor="middle">加权求和</text>

  <rect class="key" x="632" y="40" width="108" height="86" rx="10"/>
  <text class="h" x="686" y="72" text-anchor="middle">排成一卷</text>
  <text class="s" x="686" y="95" text-anchor="middle">每簇有名额</text>
  <text class="s" x="686" y="113" text-anchor="middle">留位置偶遇</text>

  <path class="ln" d="M144 83 H168" marker-end="url(#a)"/>
  <path class="ln" d="M312 83 H336" marker-end="url(#a)"/>
  <path class="ln" d="M464 83 H488" marker-end="url(#a)"/>
  <path class="ln" d="M604 83 H628" marker-end="url(#a)"/>

  <rect class="box" x="600" y="214" width="140" height="86" rx="10"/>
  <text class="h" x="670" y="248" text-anchor="middle">你翻一翻</text>
  <text class="s" x="670" y="272" text-anchor="middle">心动 · 略过 · 不喜欢</text>
  <text class="s" x="670" y="290" text-anchor="middle">读过 · 读过且喜欢</text>
  <path class="ln" d="M686 126 V210" marker-end="url(#a)"/>

  <rect class="box" x="300" y="214" width="190" height="86" rx="10"/>
  <text class="h" x="395" y="248" text-anchor="middle">调音</text>
  <text class="s" x="395" y="272" text-anchor="middle">每轮给 5 本打分</text>
  <text class="s" x="395" y="290" text-anchor="middle">本命 / 喜欢 / 一般 / 不太喜欢</text>

  <path class="fb" d="M600 257 C 520 257, 520 200, 470 170 C 380 140, 300 150, 262 130" marker-end="url(#a)"/>
  <path class="fb" d="M300 257 C 240 257, 230 200, 238 130" marker-end="url(#a)"/>
  <text class="s" x="530" y="196" text-anchor="middle" style="fill:#c96f4a">反馈改写口味</text>
  <text class="s" x="190" y="200" text-anchor="middle" style="fill:#c96f4a">给收藏分层</text>
  <text class="s" x="190" y="218" text-anchor="middle" style="fill:#c96f4a">给口味簇定权重</text>

  <text class="s" x="20" y="340">虚线：越用越懂你的那条回路。全部在你自己的电脑上完成。</text>
</svg>
